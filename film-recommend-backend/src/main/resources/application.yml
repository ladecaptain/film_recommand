spring:
  profiles:
    active: dev, local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/film_recommend?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: 604800000

tmdb:
  access-token: ${TMDB_ACCESS_TOKEN:your-tmdb-access-token}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
  proxy-host: ${TMDB_PROXY_HOST:}
  proxy-port: ${TMDB_PROXY_PORT:0}
