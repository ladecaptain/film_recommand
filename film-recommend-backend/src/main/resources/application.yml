spring:
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/film_recommend?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: 604800000

tmdb:
  api-key: ${TMDB_API_KEY:your-tmdb-api-key}
  access-token: ${TMDB_ACCESS_TOKEN:your-tmdb-access-token}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
