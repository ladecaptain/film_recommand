# 用于服务器端部署的 docker-compose
# 镜像从仓库拉取，无需本地构建
#
# 复制此文件到服务器，并创建 .env 文件配置环境变量，然后执行：
#   docker compose -f docker-compose.prod.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: film-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: film_recommend
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 生产环境无需暴露 3306 端口到宿主机
    # ports:
    #   - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: film-redis
    restart: unless-stopped
    # 生产环境无需暴露 6379 端口到宿主机
    # ports:
    #   - "6379:6379"

  backend:
    image: ryderhomo/filmrecommand-backend:latest
    container_name: film-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/film_recommend?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      REDIS_HOST: redis

  frontend:
    image: ryderhomo/filmrecommand-frontend:latest
    container_name: film-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
