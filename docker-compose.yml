services:
  mysql:
    image: mysql:8.0
    container_name: film-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: film_recommend
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./film-recommend-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: film-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./film-recommend-backend
    container_name: film-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/film_recommend?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-your-tmdb-access-token}
      REDIS_HOST: redis

  frontend:
    build: ./film-recommend-frontend
    container_name: film-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
